[project]
name = "mdconv"
version = "0.2.0"
description = "Word / Excel / PowerPoint / PDF の資料を Markdown に変換するツール"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 変換の本体は markitdown。対応形式はここで足す
dependencies = ["markitdown[docx,xlsx,pptx,pdf]>=0.1.7"]

[project.optional-dependencies]
# テストは Office ファイルを組み立てるので、生成ライブラリが要る
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
]

[project.scripts]
mdconv = "mdconv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
